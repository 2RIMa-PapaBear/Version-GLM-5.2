# ============================================================================
# DEPLOY FTP FREE.FR + WORKER CLOUDFLARE — déploiement automatique à chaque
# push sur Version-2.0.
#
# Chaîne : push → fichiers prod modifiés depuis le dernier commit marqueur
# « [deploy] » → bump auto des versions PWA (index.html ?v= + sw.js CACHE)
# → upload FTP → commit du bump (message « [deploy] …», qui ne re-déclenche
# PAS ce workflow : les pushes au token GitHub n'amorcent pas de workflow)
# → job « deploy-worker » : le relais meteo-relais (Cloudflare) suit le
#   même push — AVANT cette automatisation (audit 27/09 : M14/M17 restés
#   inactifs en prod après la publication du site), il fallait un
#   `wrangler deploy` manuel à chaque fois.
#
# Secrets à définir une fois (Settings → Secrets and variables → Actions) :
#   FTP_SERVER   ex. ftpperso.free.fr
#   FTP_USER     ex. papabear56
#   FTP_PASSWORD mot de passe Free.fr
#   CLOUDFLARE_API_TOKEN  (optionnel tant qu'absent : le job affiche un
#     simple rappel) — token Cloudflare « Edit Cloudflare Workers », cf.
#     README § Déploiement pour la création en 2 minutes.
# ============================================================================
name: Deploy FTP Free.fr

on:
  push:
    branches: [Version-2.0]
  workflow_dispatch:
    inputs:
      since:
        description: 'Réf de base du diff (vide = auto)'
        required: false
        default: ''
  # Appelé par update-radio-points.yml après son commit : un push au
  # GITHUB_TOKEN n'amorce pas de workflow, l'appelant enchaîne lui-même.
  workflow_call:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    # Le commit de bump posé par ce workflow ne doit pas re-déclencher un run
    # (double sécurité : GitHub n'amorce déjà pas de workflow pour les pushes
    # au GITHUB_TOKEN, mais gardons le garde-fou explicite).
    if: ${{ !startsWith(github.event.head_commit.message, '[deploy]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet pour trouver le marqueur)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: Version-2.0

      - name: Base du diff (dernier marqueur [deploy])
        id: base
        run: |
          if [ -n "${{ github.event.inputs.since }}" ]; then
            echo "args=--since=${{ github.event.inputs.since }}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(git log -1 --grep='^\[deploy\]' --format=%H || true)
            if [ -n "$BASE" ]; then
              echo "args=--since=$BASE" >> "$GITHUB_OUTPUT"
            else
              echo "Aucun marqueur [deploy] — premier déploiement : envoi complet."
              echo "args=--all" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Dépendances (basic-ftp pour l'upload, esbuild pour la minification)
        run: npm install --no-save basic-ftp esbuild

      # Audit 26/09 : la prod partait SANS aucun test — un test rouge
      # n'empêchait jamais le déploiement. On bloque ici, avant l'upload.
      - name: Tests (bloquants — aucun déploiement sur rouge)
        run: npm test

      - name: Déploiement FTP + bump versions
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/deploy-ftp.mjs --bump ${{ steps.base.outputs.args }}

      - name: Commit du bump (pose le marqueur [deploy])
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "Aucun bump à committer (rien n'a été déployé)."
          else
            git commit -m "[deploy] bump versions PWA"
            git push
          fi

  # ----------------------------------------------------------------------------
  # WORKER CLOUDFLARE « meteo-relais » — même push, même déploiement. Le job
  # suit `deploy` (tests bloquants inclus) : worker jamais déployé sur rouge.
  # Sans le secret CLOUDFLARE_API_TOKEN : avertissement visible, zéro échec —
  # le pilotage FTP reste indépendant.
  # ----------------------------------------------------------------------------
  deploy-worker:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: Version-2.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Déployer le worker (wrangler)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: worker
        run: npx --yes wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Rappel — secret CLOUDFLARE_API_TOKEN absent
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::Worker meteo-relais NON déployé : secret CLOUDFLARE_API_TOKEN absent. Créer un token Cloudflare (modèle « Edit Cloudflare Workers ») et l'ajouter dans Settings → Secrets and variables → Actions — cf. README § Déploiement. En attendant : cd worker && npx wrangler deploy (manuel)."
