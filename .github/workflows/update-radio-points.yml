# ============================================================================
# DONNÉES OPENAIP LOCALES — mise à jour hebdomadaire.
#
# Chaque lundi 05:30 UTC :
#   1. data/radio-points.json — radiophares + points VFR (mondial)
#   2. data/airspaces/*.json  — espaces aériens France élargie PAR FAMILLE
#      (ctr/tma/siv/atz/rpd/tmz/autres) : servies par notre serveur, elles
#      remplacent l'API pour toute vue dans la couverture (l'API refuse les
#      rafales : ~4 req/min puis 429 sans en-têtes CORS).
# Puis commit et appel du déploiement FTP (un push au GITHUB_TOKEN n'amorce
# pas de workflow : c'est le « needs/uses » qui enchaîne).
#
# Secret requis (Settings → Secrets and variables → Actions) :
#   OPENAIP_API_KEY  clé openAIP (déjà utilisée par l'app)
# ============================================================================
name: Données openAIP (maj hebdo)

on:
  schedule:
    - cron: '30 5 * * 1'   # lundi 05:30 UTC ≈ 07:30 Paris (été)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Version-2.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Régénère data/radio-points.json (openAIP mondial)
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: node scripts/fetch-radio-points.mjs

      - name: Régénère data/airspaces/*.json (France élargie, par famille)
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: node scripts/fetch-airspaces.mjs

      - name: Commit + push si changement
        run: |
          git config user.name "radio-points-bot"
          git config user.email "radio-points-bot@users.noreply.github.com"
          git add data/radio-points.json data/airspaces/
          if git diff --cached --quiet; then
            echo "Aucun changement openAIP cette semaine."
          else
            git commit -m "openAIP: mise à jour hebdomadaire radio-points + espaces ($(date -u +%F))"
            git push
          fi

  deploy:
    needs: update
    uses: ./.github/workflows/deploy-ftp.yml
    secrets: inherit
