# ============================================================================
# DONNÉES OPENAIP LOCALES — mises à jour automatiques.
#
#   HEBDOMADAIRE, LUNDI 05:30 UTC — crawl MONDIAL incrémental des espaces
#   aériens par cellule 1° (data/airspaces/cells/, budget 4 h par run via
#   .crawl.json ; l'API refuse les rafales, d'où un rythme espacé), data/
#   radio-points.json (radiophares + points VFR mondiaux) et fréquences
#   officielles SIA (eAIP).
#   (Quotidien jusqu'au 09/09/2026 — passage hebdomadaire à la demande du
#   pilote : « une fois par semaine suffit », aligné sur le README.)
# Puis commit et appel du déploiement FTP (un push au GITHUB_TOKEN n'amorce
# pas de workflow : c'est le « needs/uses » qui enchaîne).
#
# Secret requis (Settings → Secrets and variables → Actions) :
#   OPENAIP_API_KEY  clé openAIP (déjà utilisée par l'app)
# ============================================================================
name: Données openAIP (maj auto)

on:
  schedule:
    - cron: '30 5 * * 1'   # hebdomadaire, lundi 05:30 UTC ≈ 07:30 Paris (été)
  workflow_dispatch:

concurrency:
  group: update-radio-points
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Version-2.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ORDRE INVERSÉ (28/09) : les extractions COURTES d'abord, commitées et
      # poussées immédiatement. Avant, freq-sia n'était committé qu'APRÈS le
      # crawl de 4 h — et le push final était rejeté (« fetch first ») dès que
      # la branche avait avancé pendant le crawl (déploiements, bascules…) :
      # tout le travail du run était PERDU, l'état .crawl.json avec lui, d'où
      # des runs qui recommençaient de zéro (échecs des 21+23/09, exactement
      # ça) et freq-sia figé au 08-06.
      - name: Fréquences officielles SIA (eAIP, à chaque nouvel AIRAC)
        run: node scripts/fetch-freq-sia.mjs

      - name: Radiophares + points VFR
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: node scripts/fetch-radio-points.mjs

      # B4 (16/09) : Suppléments AIP série A France (page publique SIA).
      - name: Sup AIP série A (SIA)
        run: node scripts/fetch-sup-sia.mjs

      - name: Commit + push (fréquences eAIP + radio-points + sup AIP)
        run: |
          git config user.name "radio-points-bot"
          git config user.email "radio-points-bot@users.noreply.github.com"
          git add data/radio-points.json data/sup-sia.json data/freq-sia.json
          if git diff --cached --quiet; then
            echo "Aucun changement de fréquences/radio-points."
          else
            git commit -m "openAIP: fréquences eAIP + radio-points + sup AIP ($(date -u +%F))"
            git fetch origin Version-2.0
            git rebase origin/Version-2.0 || {
              git rebase --abort || true
              git merge origin/Version-2.0 || true
              # Conflits : les données du run sont les plus fraîches (le bot
              # est l'écrivain exclusif de ces fichiers) — elles gagnent.
              git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
              git add -A
              git commit --no-edit || true
            }
            git push origin Version-2.0
          fi

      - name: Crawl mondial des espaces aériens (cellules 1°, budget 4 h)
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: node scripts/fetch-airspaces.mjs --budget-minutes=240

      - name: Commit + push (cellules espaces + état du crawl)
        run: |
          git config user.name "radio-points-bot"
          git config user.email "radio-points-bot@users.noreply.github.com"
          git add data/airspaces/
          if git diff --cached --quiet; then
            echo "Aucun changement de cellules aujourd'hui."
          else
            git commit -m "openAIP: maj automatique espaces (crawl) ($(date -u +%F))"
            # Le crawl a duré 4 h : la branche a presque à coup sûr avancé
            # pendant ce temps. Ré-intégrer AVANT de pousser (rebase si
            # propre, sinon merge où les données fraîches du run gagnent),
            # puis 3 ré-essais — le rejet définitif reste signalé en rouge.
            git fetch origin Version-2.0
            if ! git rebase origin/Version-2.0; then
              git rebase --abort || true
              git merge origin/Version-2.0 || true
              git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
              git add -A
              git commit --no-edit || true
            fi
            ok=0
            for i in 1 2 3; do
              if git push origin Version-2.0; then ok=1; break; fi
              echo "  … push rejeté (essai $i/3) — ré-intégration dans 20 s"
              sleep 20
              git fetch origin Version-2.0
              git rebase origin/Version-2.0 || { git rebase --abort || true; break; }
            done
            [ "$ok" = "1" ] || { echo "::error::Push toujours rejeté après ré-essais — données du run NON publiées."; exit 1; }
          fi

  deploy:
    needs: update
    uses: ./.github/workflows/deploy-ftp.yml
    secrets: inherit

  # Garde-fou obstacles SIA (29/08, demande utilisateur) : la base obstacles
  # vient d'un export AIXM OM téléchargé MANUELLEMENT — ce job échoue (→
  # notification GitHub) tant qu'elle est en retard sur le cycle AIRAC en
  # vigueur. Job SÉPARÉ et sans needs : son échec n'entrave ni le crawl,
  # ni le commit, ni le déploiement.
  airac-obstacles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Version-2.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fraîcheur obstacles SIA vs cycle AIRAC
        run: node scripts/check-obstacles-airac.mjs

  # Garde-fou base XML SIA (05/09, question pilote « maj à chaque AIRAC ? ») :
  # terrains (identité/horaires/avitaillement/tél), pistes, espaces,
  # fréquences services/A-A — tout vient du XML_SIA téléchargé MANUELLEMENT.
  # Ce job échoue (→ notification) tant que la base est en retard.
  # Audit 26/09 : ce job exécutait check-obstacles (copier-coller) au lieu
  # de check-sia-airac — la base XML SIA n'était jamais vérifiée.
  airac-sia-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Version-2.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fraîcheur base XML SIA vs cycle AIRAC
        run: node scripts/check-sia-airac.mjs
