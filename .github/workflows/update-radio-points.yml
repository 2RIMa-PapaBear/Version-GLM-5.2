# ============================================================================
# DONNÉES OPENAIP LOCALES — mises à jour automatiques.
#
#   1. QUOTIDIEN 05:30 UTC — crawl MONDIAL incrémental des espaces aériens
#      par cellule 1° (data/airspaces/cells/, budget 4 h par run via
#      .crawl.json : le monde est couvert en quelques jours puis rafraîchi
#      en continu ; l'API refuse les rafales, d'où le rythme).
#   2. LUNDI 05:30 UTC — data/radio-points.json (radiophares + points VFR
#      mondiaux).
# Puis commit et appel du déploiement FTP (un push au GITHUB_TOKEN n'amorce
# pas de workflow : c'est le « needs/uses » qui enchaîne).
#
# Secret requis (Settings → Secrets and variables → Actions) :
#   OPENAIP_API_KEY  clé openAIP (déjà utilisée par l'app)
# ============================================================================
name: Données openAIP (maj auto)

on:
  schedule:
    - cron: '30 5 * * *'   # quotidien 05:30 UTC ≈ 07:30 Paris (été)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Version-2.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crawl mondial des espaces aériens (cellules 1°, budget 4 h)
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: node scripts/fetch-airspaces.mjs --budget-minutes=240

      - name: Radiophares + points VFR (lundi seulement)
        if: github.event.schedule == '30 5 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: node scripts/fetch-radio-points.mjs

      - name: Commit + push si changement
        run: |
          git config user.name "radio-points-bot"
          git config user.email "radio-points-bot@users.noreply.github.com"
          git add data/radio-points.json data/airspaces/
          if git diff --cached --quiet; then
            echo "Aucun changement openAIP aujourd'hui."
          else
            git commit -m "openAIP: maj automatique espaces (crawl) + radio-points ($(date -u +%F))"
            git push
          fi

  deploy:
    needs: update
    uses: ./.github/workflows/deploy-ftp.yml
    secrets: inherit
