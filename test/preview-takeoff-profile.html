<!DOCTYPE html>
<!-- Aperçu autonome du schéma de décollage en coupe (js/takeoff-profile.js).
     Servi en HTTP local (modules ES) : sert de QA visuelle + géométrique
     (les <text> et avions doivent rester dans le viewBox). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu — profil de décollage</title>
<style>
    :root {
        --text-color: #E2E8F0;
        --text-muted: #94A3B8;
        --border-color: #334155;
        --input-bg: #0F172A;
    }
    body { background:#0B1220; color:var(--text-color); font-family:'DM Sans',sans-serif; margin:0; padding:14px; }
    .panel { max-width:380px; background:#0F172A; border:1px solid var(--border-color); border-radius:10px; padding:12px; margin-bottom:14px; }
    .panel h3 { margin:0 0 8px; font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
    #qa-result { font-family:monospace; font-size:11px; white-space:pre-wrap; color:#4ADE80; }
    #qa-result.err { color:#F87171; }
</style>
</head>
<body>
<div id="cases"></div>
<pre id="qa-result">QA en cours…</pre>

<script type="module">
import { takeoffProfileSvg } from '../js/takeoff-profile.js';

// Mêmes formes que evaluateTakeoffPerformance.
const CASES = [
    { title: 'OK — marge confortable (piste 1005 m)', r: { groundRoll: 950, fiftyFt: 1680, runwayLength: 3300, margin: 1620, level: 'ok' } },
    { title: 'Caution — marge faible (piste 579 m)', r: { groundRoll: 950, fiftyFt: 1680, runwayLength: 1900, margin: 220, level: 'caution' } },
    { title: 'Danger — 50 ft au-delà de la piste (piste 457 m)', r: { groundRoll: 950, fiftyFt: 1680, runwayLength: 1500, margin: -180, level: 'danger' } },
    { title: 'Piste inconnue', r: { groundRoll: 950, fiftyFt: 1680, runwayLength: null, margin: null, level: 'unknown' } },
    { title: 'Extrême — très longue piste (2438 m)', r: { groundRoll: 700, fiftyFt: 1250, runwayLength: 8000, margin: 6750, level: 'ok' } },
    { title: 'Extrême — roulement avant la fin, 50 ft bien après', r: { groundRoll: 900, fiftyFt: 1680, runwayLength: 1000, margin: -680, level: 'danger' } },
    { title: 'Version anglaise (OK)', r: { groundRoll: 950, fiftyFt: 1680, runwayLength: 3300, margin: 1620, level: 'ok' }, en: true },
];

const host = document.getElementById('cases');
for (const c of CASES) {
    const div = document.createElement('div');
    div.className = 'panel';
    div.innerHTML = `<h3>${c.title}</h3>` + takeoffProfileSvg(c.r, !c.en);
    host.appendChild(div);
}

// ---- QA géométrique post-rendu : tout doit rester dans le cadre du SVG ----
// getBoundingClientRect (écran) tient compte des transform des <g>,
// contrairement à getBBox ; on compare au rect écran du <svg> lui-même.
const problems = [];
for (const svg of document.querySelectorAll('svg')) {
    const sb = svg.getBoundingClientRect();
    const label = svg.closest('.panel')?.querySelector('h3')?.textContent || '?';
    for (const el of svg.querySelectorAll('text, g')) {
        const b = el.getBoundingClientRect();
        if (b.width === 0 && b.height === 0) continue;
        if (b.left < sb.left - 1 || b.top < sb.top - 1 || b.right > sb.right + 1 || b.bottom > sb.bottom + 1) {
            problems.push(`${label} : <${el.tagName}> hors cadre `
                + `(left=${(b.left - sb.left).toFixed(1)}, top=${(b.top - sb.top).toFixed(1)}, `
                + `right=${(b.right - sb.left).toFixed(1)}, bottom=${(b.bottom - sb.top).toFixed(1)} vs ${sb.width.toFixed(0)}x${sb.height.toFixed(0)})`);
        }
    }
}
const out = document.getElementById('qa-result');
const qaText = problems.length
    ? 'QA: KO\n' + problems.join('\n')
    : `QA: OK — ${document.querySelectorAll('svg').length} schémas, tous les éléments dans le viewBox`;
out.className = problems.length ? 'err' : '';
out.textContent = qaText;
document.title = problems.length ? 'QA KO' : 'QA OK';

// Remonte le résultat au serveur local (capture Edge headless).
fetch('/qa-report', { method: 'POST', body: qaText }).catch(() => {});
</script>
</body>
</html>
