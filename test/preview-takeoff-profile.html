<!DOCTYPE html>
<!-- Aperçu autonome du schéma de décollage en coupe (js/takeoff-profile.js).
     Servi en HTTP local (modules ES) : QA visuelle + géométrique.
     (La barre « plan » historique a été supprimée du widget : la coupe est
     seule, pleine largeur, échelle proportionnelle aux distances.) -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu — profil de décollage</title>
<style>
    :root {
        --text-color: #E2E8F0;
        --text-muted: #94A3B8;
        --border-color: #334155;
        --input-bg: #0F172A;
    }
    body { background:#0B1220; color:var(--text-color); font-family:'DM Sans',sans-serif; margin:0; padding:14px; }
    .row { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
    .panel { background:#0F172A; border:1px solid var(--border-color); border-radius:10px; padding:12px; margin-bottom:14px; }
    .narrow { width:380px; }
    .wide { width:796px; } /* card 826 - 2*15 padding ≈ colonne centrale desktop */
    .panel h3 { margin:0 0 8px; font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
    .ref { font-size:10px; color:var(--text-muted); font-family:'DM Mono',monospace; margin:6px 0 0; }
    #qa-result { font-family:monospace; font-size:11px; white-space:pre-wrap; color:#4ADE80; }
    #qa-result.err { color:#F87171; }
</style>
</head>
<body>
<div id="cases"></div>
<pre id="qa-result">QA en cours…</pre>

<script type="module">
import { mountTakeoffProfile } from '../js/takeoff-profile.js';

const CASES = [
    { title: 'OK — marge confortable (piste 1005 m)', r: { groundRoll: 950, fiftyFt: 1680, runwayLength: 3300, margin: 1620, level: 'ok' } },
    { title: 'Caution — marge faible (piste 579 m)', r: { groundRoll: 950, fiftyFt: 1680, runwayLength: 1900, margin: 220, level: 'caution' } },
    { title: 'Danger — 50 ft au-delà de la piste (piste 457 m)', r: { groundRoll: 950, fiftyFt: 1680, runwayLength: 1500, margin: -180, level: 'danger' } },
    { title: 'Piste inconnue (pas de marge)', r: { groundRoll: 950, fiftyFt: 1680, runwayLength: null, margin: null, level: 'unknown' } },
    { title: 'Extrême — très longue piste (2438 m)', r: { groundRoll: 700, fiftyFt: 1250, runwayLength: 8000, margin: 6750, level: 'ok' } },
    { title: 'Extrême — roulement avant la fin, 50 ft bien après', r: { groundRoll: 900, fiftyFt: 1680, runwayLength: 1000, margin: -680, level: 'danger' } },
    { title: 'Version anglaise (OK)', r: { groundRoll: 950, fiftyFt: 1680, runwayLength: 3300, margin: 1620, level: 'ok' }, en: true },
];

const host = document.getElementById('cases');
for (const c of CASES) {
    for (const cls of ['narrow', 'wide']) {
        const div = document.createElement('div');
        div.className = 'panel ' + cls;
        div.innerHTML = `<h3>${c.title} — ${cls === 'narrow' ? '354 px' : '770 px'}</h3>`
            + `<div class="tp"></div>`
            + `<p class="ref">réf. 10 px : 0123456789 m</p>`;
        host.appendChild(div);
        mountTakeoffProfile(div.querySelector('.tp'), c.r, !c.en);
    }
}

// ---- QA après stabilisation (ResizeObserver asynchrone) ----
const check = () => {
    const problems = [];
    for (const panel of document.querySelectorAll('.panel')) {
        const label = panel.querySelector('h3')?.textContent || '?';
        const svg = panel.querySelector('svg');
        if (!svg) continue;
        const sb = svg.getBoundingClientRect();

        // Échelle 1:1 : hauteur rendue ≈ 108 (sinon le viewBox est étiré).
        const scale = sb.height / 108;
        if (Math.abs(scale - 1) > 0.03) problems.push(`${label} : échelle ${scale.toFixed(2)} ≠ 1`);

        // Rien hors cadre.
        for (const el of svg.querySelectorAll('text, g')) {
            const b = el.getBoundingClientRect();
            if (b.width === 0 && b.height === 0) continue;
            if (b.left < sb.left - 1 || b.top < sb.top - 1 || b.right > sb.right + 1 || b.bottom > sb.bottom + 1) {
                problems.push(`${label} : <${el.tagName}> hors cadre`);
            }
        }
        // Typo : tous les textes à 10 px calculés (taille du widget).
        for (const t of svg.querySelectorAll('text')) {
            const fs = getComputedStyle(t).fontSize;
            if (fs !== '10px') problems.push(`${label} : texte à ${fs} au lieu de 10px`);
        }
    }
    return problems;
};

await new Promise(r => setTimeout(r, 300)); // laisse le ResizeObserver re-rendre
const problems = check();

const out = document.getElementById('qa-result');
const qaText = problems.length
    ? 'QA: KO\n' + problems.join('\n')
    : `QA: OK — ${document.querySelectorAll('svg').length} schémas : échelle 1:1, textes 10 px, rien hors cadre`;
out.className = problems.length ? 'err' : '';
out.textContent = qaText;
document.title = problems.length ? 'QA KO' : 'QA OK';

// Remonte le résultat au serveur local (capture Edge headless).
fetch('/qa-report', { method: 'POST', body: qaText }).catch(() => {});
</script>
</body>
</html>
